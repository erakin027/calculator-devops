events {}

http {
    # Docker's embedded DNS; re-resolve the service name so replicas
    # can be recreated by a redeploy without restarting nginx.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $backend http://calculator:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
