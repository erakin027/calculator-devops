name: calculator

services:
  calculator:
    image: ${IMAGE_REPO:-calculator-devops}:${IMAGE_TAG:-latest}
    build: .
    environment:
      - SERVER_PORT=8080
      - JAVA_OPTS=-XX:MaxRAMPercentage=75
    ports:
      - "${HOST_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
