name: calculator

services:
  calculator:
    image: ${IMAGE_REPO:-calculator-devops}:${IMAGE_TAG:-latest}
    build: .
    environment:
      - SERVER_PORT=8080
      - JAVA_OPTS=-XX:MaxRAMPercentage=75
    expose:
      - "8080"
    deploy:
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - calc-net

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
